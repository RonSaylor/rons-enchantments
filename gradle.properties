org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Shared environment for every mod in the series.
# Values taken from the official NeoForge MDK (NeoForgeMDKs/MDK-1.21.1-ModDevGradle).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Dev/test NeoForge build: pinned to the one the local "Book of Dragons" instance runs.
neo_version=21.1.265
# NeoForge versions players may use. 21.1.1 is the oldest 1.21.1 build; the full game-test suite
# passes on it with Book of Dragons and FAUNA Engine loaded (both of which accept [21.1,)).
# Check with: ./gradlew runGameTestServer "-Pneo_version=21.1.1"
neo_version_range=[21.1.1,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Shared mod metadata. Per-mod values (mod_id, mod_name, mod_description, mod_version)
# live in each subproject's gradle.properties.
mod_license=MIT
mod_authors=Ron
mod_group_id=com.ronsmods
