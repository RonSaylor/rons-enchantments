org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Shared environment for every mod in the series.
# Values taken from the official NeoForge MDK (NeoForgeMDKs/MDK-1.21.1-ModDevGradle).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Pinned to the NeoForge build used by the local "Book of Dragons" instance so the generated
# dependency range ([neo_version,)) accepts it. Bumping is safe; it only raises the minimum.
neo_version=21.1.265
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Shared mod metadata. Per-mod values (mod_id, mod_name, mod_description, mod_version)
# live in each subproject's gradle.properties.
mod_license=MIT
mod_authors=Ron
mod_group_id=com.ronsmods
